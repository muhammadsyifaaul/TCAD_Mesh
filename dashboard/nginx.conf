server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Health endpoint — answered directly by nginx
    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"dashboard","version":"0.1.0"}';
    }

    # Proxy API calls to control-api (same Docker network)
    # Dashboard JS calls /stats, /events, /quarantine, etc. as relative URLs.
    location ~ ^/(stats|events|quarantine|honeytokens|sim)(/.*)?$ {
        proxy_pass         http://control-api:8003;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 10s;
        # Pass the internal key header from client requests through to control-api
        proxy_pass_request_headers on;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options   "DENY"          always;
    add_header X-Content-Type-Options "nosniff"  always;
    add_header Referrer-Policy   "no-referrer"   always;
}
